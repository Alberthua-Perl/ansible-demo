---
- name: Deploy Nginx Web Servers
  hosts: webservers

  vars:
    nginx_port: 80
    nginx_worker_processes: "{{ ansible_processor_vcpus }}"
    nginx_worker_connections: 1024
    website_title: "Ansible自动化部署演示"

  tasks:
    - name: 更新系统包缓存
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: 安装 Nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: 创建网站目录
      ansible.builtin.file:
        path: /var/www/html
        state: directory
        mode: '0755'

    - name: 部署 Nginx 配置文件
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        backup: yes
      notify: restart nginx

    - name: 部署网站首页
      ansible.builtin.template:
        src: index.html.j2
        dest: /var/www/html/index.html
        mode: '0644'

    - name: 确保 Nginx 服务运行
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: yes

    - name: 等待端口就绪
      ansible.builtin.wait_for:
        port: "{{ nginx_port }}"
        host: "{{ ansible_default_ipv4.address }}"
        delay: 5
        timeout: 30

  handlers:
    - name: restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted

